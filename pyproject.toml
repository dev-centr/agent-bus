[project]
name = "session-router"
version = "0.1.0"
description = "Choose a harness door for a missing feature, and record the hack by release."
requires-python = ">=3.11"
readme = "README.adoc"

[project.scripts]
session-router = "session_router.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
